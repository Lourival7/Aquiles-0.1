<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aquiles 0.1</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
        }

        .cabecalho {
            background: #0f172a;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #334155;
        }

        .cabecalho h1 {
            margin: 0;
            font-size: 28px;
        }

        .cabecalho p {
            margin: 6px 0 0;
            color: #94a3b8;
        }

        .conversa {
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
        }

        .mensagem {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            word-wrap: break-word;
        }

        .mensagem strong {
            color: #60a5fa;
        }

        .entrada {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        input {
            flex: 1;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 15px 20px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 10px;
        }

        .erro {
            color: #fca5a5;
        }

        .sucesso {
            color: #86efac;
        }
    </style>
</head>

<body>

    <div class="cabecalho">
        <h1>⚔️ Aquiles 0.1</h1>
        <p>Seu parceiro de análise esportiva</p>
    </div>

    <div class="conversa">

        <div class="mensagem">
            <strong>Aquiles:</strong>

            <p id="saudacao">
                Olá, Lourival. Estou conectando minha memória...
            </p>

            <div class="status" id="status">
                Conectando ao banco de memória...
            </div>
        </div>

        <div id="mensagens"></div>

        <div class="entrada">

            <input
                id="campoMensagem"
                type="text"
                placeholder="Digite uma mensagem..."
            >

            <button id="botaoEnviar" onclick="enviarMensagem()">
                Enviar
            </button>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        // =====================================================
        // CONFIGURAÇÃO DO SUPABASE
        // =====================================================

        const SUPABASE_URL =
            "https://qqhltwlfooiyaalirwbi.supabase.co";

        // =====================================================
        // COLOQUE SUA PUBLISHABLE KEY AQUI
        //
        // NÃO COLOQUE A SECRET KEY.
        // Use somente a chave que começa com:
        // sb_publishable_
        // =====================================================

        const SUPABASE_PUBLISHABLE_KEY =
        sb_publishable_U1CpDb91_Q3Nn05Hfu9Wsw_9MT5kEhY    

        // =====================================================

        const status = document.getElementById("status");
        const saudacao = document.getElementById("saudacao");
        const mensagens = document.getElementById("mensagens");
        const campoMensagem = document.getElementById("campoMensagem");
        const botaoEnviar = document.getElementById("botaoEnviar");


        // Verificação básica da chave
        if (
            !SUPABASE_PUBLISHABLE_KEY ||
            SUPABASE_PUBLISHABLE_KEY === "COLE_AQUI_SUA_PUBLISHABLE_KEY"
        ) {

            status.textContent =
                "A Publishable Key ainda não foi colocada.";

            status.className = "status erro";

        }


        // Cria a conexão com o Supabase
        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        // =====================================================
        // TESTAR MEMÓRIA
        // =====================================================

        async function testarMemoria() {

            status.textContent =
                "Testando conexão com minha memória...";

            status.className = "status";


            const resultado =
                await supabaseClient
                    .from("memorias")
                    .select("*")
                    .order("id", { ascending: false })
                    .limit(20);


            const data = resultado.data;
            const error = resultado.error;


            if (error) {

                console.error("Erro Supabase:", error);

                saudacao.textContent =
                    "Estou conectado ao site, mas encontrei um problema ao acessar minha memória.";

                status.textContent =
                    "Erro ao acessar o banco: " +
                    error.message;

                status.className = "status erro";

                return;
            }


            saudacao.textContent =
                "Boa noite, Lourival. Eu sou o Aquiles 0.1.";

            status.textContent =
                "Minha conexão com a memória está funcionando.";

            status.className = "status sucesso";


            // Mostra memórias anteriores
            if (data && data.length > 0) {

                data.reverse().forEach(function(memoria) {

                    mostrarMensagem(
                        "Aquiles — memória",
                        memoria.conteudo
                    );

                });

            }

        }


        // =====================================================
        // MOSTRAR MENSAGEM NA TELA
        // =====================================================

        function mostrarMensagem(remetente, texto) {

            const caixa =
                document.createElement("div");

            caixa.className = "mensagem";


            const nome =
                document.createElement("strong");

            nome.textContent =
                remetente + ":";


            const conteudo =
                document.createElement("p");

            conteudo.textContent =
                texto;


            caixa.appendChild(nome);
            caixa.appendChild(conteudo);

            mensagens.appendChild(caixa);

        }


        // =====================================================
        // ENVIAR MENSAGEM
        // =====================================================

        async function enviarMensagem() {

            const texto =
                campoMensagem.value.trim();


            if (texto === "") {
                return;
            }


            // Mostra imediatamente o que Lourival escreveu
            mostrarMensagem(
                "Você",
                texto
            );


            campoMensagem.value = "";

            botaoEnviar.disabled = true;

            status.textContent =
                "Gravando sua mensagem na memória...";

            status.className = "status";


            try {

                const resultado =
                    await supabaseClient
                        .from("memorias")
                        .insert({

                            conteudo: texto,

                            categoria: "conversa",

                            fonte: "Lourival",

                            tipo: "conhecimento"

                        })
                        .select();


                const data = resultado.data;
                const error = resultado.error;


                if (error) {

                    console.error(
                        "ERRO AO GRAVAR:",
                        error
                    );


                    status.textContent =
                        "Não consegui gravar a memória: " +
                        error.message;

                    status.className =
                        "status erro";


                    mostrarMensagem(
                        "Aquiles",
                        "Recebi sua mensagem, mas ocorreu um erro ao gravá-la. O próprio sistema mostrou o motivo acima."
                    );


                } else {

                    console.log(
                        "Memória gravada:",
                        data
                    );


                    status.textContent =
                        "Memória gravada com sucesso.";

                    status.className =
                        "status sucesso";


                    mostrarMensagem(
                        "Aquiles",
                        "Recebi sua mensagem e guardei na minha memória."
                    );

                }


            } catch (erro) {

                console.error(
                    "ERRO GERAL:",
                    erro
                );


                status.textContent =
                    "Erro inesperado: " +
                    erro.message;

                status.className =
                    "status erro";


                mostrarMensagem(
                    "Aquiles",
                    "Aconteceu um erro inesperado ao tentar acessar minha memória."
                );

            }


            botaoEnviar.disabled = false;

            campoMensagem.focus();

        }


        // Permite enviar apertando Enter
        campoMensagem.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    enviarMensagem();

                }

            }
        );


        // Inicia o teste da memória
        testarMemoria();

    </script>

</body>
</html>
