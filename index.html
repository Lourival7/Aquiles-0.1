<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aquiles 0.1</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
        }

        .cabecalho {
            background: #0f172a;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #334155;
        }

        .cabecalho h1 {
            margin: 0;
            font-size: 28px;
        }

        .cabecalho p {
            margin: 6px 0 0;
            color: #94a3b8;
        }

        .conversa {
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
        }

        .mensagem {
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .entrada {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        input {
            flex: 1;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 16px;
        }

        button {
            padding: 15px 20px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .status {
            color: #94a3b8;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="cabecalho">
        <h1>⚔️ Aquiles 0.1</h1>
        <p>Seu parceiro de análise esportiva</p>
    </div>

    <div class="conversa">

        <div class="mensagem">
            <strong>Aquiles:</strong>
            <p id="saudacao">Olá, Lourival. Estou conectando minha memória...</p>
            <div class="status" id="status">Conectando ao banco de memória...</div>
        </div>

        <div id="mensagens"></div>

        <div class="entrada">
            <input
                id="campoMensagem"
                type="text"
                placeholder="Digite uma mensagem..."
            >

            <button onclick="enviarMensagem()">
                Enviar
            </button>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL = "https://qqhltwlfooiyaalirwbi.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY = sb_publishable_U1CpDb91_Q3Nn05Hfu9Wsw_9MT5kEhY;

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        async function testarMemoria() {

            const status = document.getElementById("status");
            const saudacao = document.getElementById("saudacao");

            const { data, error } = await supabaseClient
                .from("memorias")
                .select("*")
                .limit(1);

            if (error) {

                console.log(error);

                status.textContent =
                    "Banco conectado, mas ainda precisamos configurar a segurança da memória.";

                return;
            }

            saudacao.textContent =
                "Boa noite, Lourival. Eu sou o Aquiles 0.1.";

            status.textContent =
                "Minha conexão com a memória está funcionando.";

            console.log("Memória:", data);
        }


        async function enviarMensagem() {
            alert("O botão Enviar está funcionando!");
            const campo = document.getElementById("campoMensagem");

            const mensagens = document.getElementById("mensagens");

            const texto = campo.value.trim();

            if (texto === "") {
                return;
            }

            mensagens.innerHTML += `
                <div class="mensagem">
                    <strong>Você:</strong>
                    <p>${texto}</p>
                </div>
            `;
alert("Vou tentar gravar no Supabase!");

            const { error } = await supabaseClient
                .from("memorias")
                .insert({
                    conteudo: texto,
                    categoria: "conversa",
                    fonte: "Lourival",
                    tipo: "conhecimento"
                });

            if (error) {

                console.log(error);

                mensagens.innerHTML += `
                    <div class="mensagem">
                        <strong>Aquiles:</strong>
                        <p>Recebi sua mensagem, mas minha memória ainda está sendo configurada.</p>
                    </div>
                `;

            } else {

                mensagens.innerHTML += `
                    <div class="mensagem">
                        <strong>Aquiles:</strong>
                        <p>Recebi sua mensagem e guardei na minha memória.</p>
                    </div>
                `;
            }

            campo.value = "";
        }


        testarMemoria();

    </script>

</body>
</html>
