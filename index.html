<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aquiles 0.1</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      margin: 0;
      padding: 20px;
    }

    .chat {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    #mensagens {
      background: #222;
      border-radius: 10px;
      padding: 15px;
      min-height: 300px;
      margin-bottom: 15px;
    }

    .mensagem {
      margin: 10px 0;
      padding: 10px;
      border-radius: 8px;
    }

    .usuario {
      background: #333;
      text-align: right;
    }

    .aquiles {
      background: #1d4d3a;
    }

    .entrada {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="chat">
    <h1>Aquiles 0.1</h1>

    <div id="mensagens">
      <div class="mensagem aquiles">
        Olá, Lourival. Eu sou o Aquiles 0.1.
      </div>
    </div>

    <div class="entrada">
      <input
        type="text"
        id="entrada"
        placeholder="Digite uma mensagem..."
      >
      <button onclick="enviarMensagem()">Enviar</button>
      <input type="file" id="imagem" accept="image/*">
      <img id="previewImagem" style="max-width:300px; display:none;">
    </div>
  </div>

  <script>
    let memoria = null;

    fetch("./memoria.json")
      .then(resposta => resposta.json())
      .then(dados => {
        memoria = dados;
      })
      .catch(() => {
        console.log("Não foi possível carregar a memória.");
      });

    function adicionarMensagem(texto, tipo) {
      const mensagens = document.getElementById("mensagens");

      const div = document.createElement("div");
      div.className = "mensagem " + tipo;
      div.textContent = texto;

      mensagens.appendChild(div);
      mensagens.scrollTop = mensagens.scrollHeight;
    }

    function responder(pergunta) {
      const texto = pergunta.toLowerCase();

      if (!memoria) {
        return "Minha memória ainda está carregando. Tente novamente em alguns segundos.";
      }

      if (
        texto.includes("oi") ||
        texto.includes("olá") ||
        texto.includes("ola") ||
        texto.includes("bom dia") ||
        texto.includes("boa tarde") ||
        texto.includes("boa noite")
      ) {
        return "Olá, Lourival. Que bom falar com você. Eu sou o Aquiles 0.1.";
      }

      if (
        texto.includes("seu nome") ||
        texto.includes("qual seu nome") ||
        texto.includes("quem é você") ||
        texto.includes("quem e voce")
      ) {
        return "Meu nome é " + memoria.Aquiles.Nome +
               ". Minha versão atual é " + memoria.Aquiles.Versao + ".";
      }

      if (
        texto.includes("seu criador") ||
        texto.includes("quem criou você") ||
        texto.includes("quem criou voce") ||
        texto.includes("quem é seu criador") ||
        texto.includes("quem e seu criador")
      ) {
        return "Meu criador é " + memoria.Aquiles.Criador +
               ". Ele também é meu principal parceiro de desenvolvimento.";
      }

      if (
        texto.includes("funções") ||
        texto.includes("funcoes") ||
        texto.includes("o que você faz") ||
        texto.includes("o que voce faz")
      ) {
        return "Minhas principais funções são: " +
          memoria.Aquiles.FuncoesPrincipais.join(", ") + ".";
      }

      if (
        texto.includes("quem sou eu") ||
        texto.includes("meu nome")
      ) {
        return "Você é " + memoria.Usuario.Nome +
               ", meu criador e principal parceiro de desenvolvimento.";
      }

      return "Ainda estou aprendendo, Lourival. Essa é uma das coisas que vamos ensinar ao Aquiles.";
    }

    function enviarMensagem() {
      const campo = document.getElementById("entrada");
      const pergunta = campo.value.trim();

      if (pergunta === "") {
        return;
      }

      adicionarMensagem(pergunta, "usuario");

      const resposta = responder(pergunta);

      setTimeout(() => {
        adicionarMensagem(resposta, "aquiles");
      }, 300);

      campo.value = "";
      campo.focus();
    }

    document.getElementById("entrada").addEventListener("keydown", function(evento) {
      if (evento.key === "Enter") {
        enviarMensagem();
      }
    });
  </script>
  <script>
  const inputImagem = document.getElementById("imagem");
  const previewImagem = document.getElementById("previewImagem");

  inputImagem.addEventListener("change", function () {
    const arquivo = this.files[0];

    if (arquivo) {
      previewImagem.src = URL.createObjectURL(arquivo);
      previewImagem.style.display = "block";
    }
  });
</script>
</body>
</html>
