<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aquiles 0.1</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      margin: 0;
      padding: 20px;
    }

    .chat {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    #mensagens {
      background: #222;
      border-radius: 10px;

      min-height: 300px;

    }

    .mensagem {
      margin: 10px 0;

      border-radius: 8px;
    }

    .usuario {

      text-align: right;
    }

    .aquiles {
      background: #1d4d3a;
    }

    .entrada {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;

      font-size: 16px;
    } 
    .barra-mensagem {
  display: flex;
  gap: 10px;
  width: 100%;
  align-items: center;
}

.barra-mensagem input {
  flex: 1;
  min-width: 0;
  height: 48px;
  box-sizing: border-box;
}

.barra-mensagem button {
  height: 48px;
  padding: 0 22px;
  white-space: nowrap;
}

.painel-imagem {
  margin-top: 15px;
  width: 100%;
  padding: 15px;
  box-sizing: border-box;
  border-radius: 12px;
  background: rgba(255,255,255,0.06);
}

.botao-arquivo {
  display: inline-block;
  padding: 10px 16px;
  border-radius: 8px;
  cursor: pointer;
  background: rgba(255,255,255,0.12);
  color: white;
  font-size: 14px;
}

#imagem {
  display: none;
}

#previewImagem {
  display: block;
  margin-top: 15px;
  max-width: 100%;

  border-radius: 10px;

} 
    /* ===== VISUAL NOVO DO AQUILES ===== */

:root {
  --fundo: #080b14;
  --painel: #111827;
  --painel-claro: #182235;
  --borda: rgba(255,255,255,0.10);
  --texto: #f8fafc;
  --texto-suave: #9ca3af;
  --destaque: #7c3aed;
  --destaque-2: #2563eb;
}

/* Fundo geral */
body {
  min-height: 100vh;
  background:
    radial-gradient(circle at top, #172554 0%, #0b1020 35%, #05070d 100%);
  color: var(--texto);
  font-family: "Segoe UI", Arial, sans-serif;
}

/* Título Aquiles 0.1 */
h1 {
  font-family: "Trebuchet MS", "Segoe UI", sans-serif;
  font-size: 34px;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-align: center;
  margin-bottom: 25px;
  background: linear-gradient(90deg, #ffffff, #a78bfa, #60a5fa);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: 0 0 25px rgba(124, 58, 237, 0.25);
}

/* Área principal */
.chat {
  background: rgba(17, 24, 39, 0.88);
  border: 1px solid var(--borda);
  border-radius: 22px;
  padding: 18px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  backdrop-filter: blur(10px);
}

/* Painel onde ficam imagem + edição */
.painel-imagem {
  display: flex;
  align-items: stretch;
  gap: 10px;
  width: 100%;
  margin-top: 12px;
}

/* Campo de escolher imagem */
#imagem {
  display: none;
}

/* Botão de escolher imagem */
label[for="imagem"] {
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 18px;
  border-radius: 14px;
  background: linear-gradient(135deg, #1f2937, #293548);
  border: 1px solid rgba(255,255,255,0.12);
  color: white;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: 0.2s ease;
}

label[for="imagem"]:hover {
  transform: translateY(-1px);
  border-color: #8b5cf6;
  box-shadow: 0 8px 25px rgba(124,58,237,0.22);
}

/* Botão Editar imagem */
#editarImagem,
.editar-imagem,
button[onclick*="editarImagem"] {
  min-height: 52px;
  padding: 0 18px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--destaque), var(--destaque-2));
  color: #fff;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
  box-shadow: 0 8px 25px rgba(37,99,235,0.22);
  transition: 0.2s ease;
}

#editarImagem:hover,
.editar-imagem:hover,
button[onclick*="editarImagem"]:hover {
  transform: translateY(-1px);
  box-shadow: 0 10px 30px rgba(124,58,237,0.35);
}
/* ===== ORGANIZAR ESCOLHER IMAGEM + EDITAR IMAGEM ===== */

.acoes-imagem {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.acoes-imagem label[for="imagem"],
.acoes-imagem #editarImagem,
.acoes-imagem .editar-imagem {
  flex: 0 0 auto;
}

/* Descrição fica embaixo dos botões */
.acoes-imagem + .barra-mensagem,
.acoes-imagem + textarea,
.acoes-imagem + input[type="text"] {
  width: 100%;
}
/* Barra onde fica a descrição/mensagem */
.barra-mensagem {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  margin-top: 12px;
}

/* Campo de texto */
.barra-mensagem input,
.barra-mensagem textarea {
  flex: 1;
  min-width: 0;
  min-height: 52px;
  padding: 13px 16px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.10);
  background: #0f172a;
  color: white;
  outline: none;
  font-size: 14px;
  transition: 0.2s ease;
}

.barra-mensagem input:focus,
.barra-mensagem textarea:focus {
  border-color: #8b5cf6;
  box-shadow: 0 0 0 3px rgba(124,58,237,0.15);
}

/* Texto de exemplo dentro do campo */
.barra-mensagem input::placeholder,
.barra-mensagem textarea::placeholder {
  color: #64748b;
}

/* Botões gerais */
button {
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

button:hover {
  transform: translateY(-1px);
}

/* Preview da imagem */
#previewImagem {
  background: #0b1020;
  border: 1px solid rgba(255,255,255,0.10);
  padding: 8px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.25);
}

/* Celular */
@media (max-width: 600px) {
  .painel-imagem {
    flex-wrap: wrap;
  }

  .barra-mensagem {
    flex-wrap: wrap;
  }

  label[for="imagem"],
  #editarImagem,
  .editar-imagem,
  button[onclick*="editarImagem"] {
    flex: 1;
  }

  h1 {
    font-size: 28px;
  }
} 
  /* ===== DEIXAR OS 3 BOTÕES COM O MESMO VISUAL ===== */

label[for="imagem"],
#editarImagem,
.editar-imagem,
button[onclick*="editarImagem"],
button[type="submit"] {
  min-height: 52px;
  padding: 0 18px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(135deg, #7c3aed, #2563eb) !important;
  color: white !important;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  box-shadow: 0 8px 25px rgba(37, 99, 235, 0.25);
  transition: 0.2s ease;
}

label[for="imagem"]:hover,
#editarImagem:hover,
.editar-imagem:hover,
button[onclick*="editarImagem"]:hover,
button[type="submit"]:hover {
  transform: translateY(-1px);
  box-shadow: 0 10px 30px rgba(124, 58, 237, 0.35);
} 
 /* ===== MENSAGEM DO AQUIL ES EM LARANJA FLUORESCENTE ===== */
.mensagem-aquiles,
.message.bot,
.bot-message,
.assistant-message,
.chat-message.bot,
.chat-box .message:first-child {
  background: linear-gradient(135deg, #ff7a00, #ffb300) !important;
  color: #ffffff !important;
  border: 1px solid rgba(255, 160, 0, 0.9) !important;
  box-shadow: 0 0 18px rgba(255, 145, 0, 0.45) !important;
  border-radius: 12px !important;
  font-weight: 700;
}

/* ===== BOTÃO ENVIAR AZUL ===== */
button[type="submit"],
#enviar,
.botao-enviar,
input[type="submit"] {
  min-height: 52px;
  padding: 0 18px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(135deg, #2563eb, #1d4ed8) !important;
  color: #ffffff !important;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  box-shadow: 0 8px 25px rgba(37, 99, 235, 0.35) !important;
  transition: 0.2s ease;
}

button[type="submit"]:hover,
#enviar:hover,
.botao-enviar:hover,
input[type="submit"]:hover {
  transform: translateY(-1px);
  box-shadow: 0 10px 30px rgba(37, 99, 235, 0.45) !important;
}   
  /* ===== FAIXA DO AQUILES EM LARANJA FLUORESCENTE ===== */
.mensagem.aquiles {
  background: linear-gradient(135deg, #ff6a00, #ff9d00) !important;
  color: #ffffff !important;
  border: 1px solid #ffb347 !important;
  box-shadow:
    0 0 12px rgba(255, 106, 0, 0.65),
    0 0 25px rgba(255, 157, 0, 0.35) !important;
}

/* ===== BOTÃO ENVIAR AZUL ===== */
.barra-mensagem button {
  min-height: 52px;
  padding: 0 18px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(135deg, #2563eb, #1d4ed8) !important;
  color: #ffffff !important;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  box-shadow: 0 8px 25px rgba(37, 99, 235, 0.35) !important;
  transition: 0.2s ease;
}

.barra-mensagem button:hover {
  transform: translateY(-1px);
  box-shadow: 0 10px 30px rgba(37, 99, 235, 0.45) !important;
}  
    /* ===== CAMPO DE PEDIDO DA EDIÇÃO DE IMAGEM ===== */
#pedidoImagem {
  background: linear-gradient(135deg, #ff6a00, #ff9d00) !important;
  color: #ffffff !important;
  border: 1px solid #ffb347 !important;
  border-radius: 12px !important;
  box-shadow:
    0 0 12px rgba(255, 106, 0, 0.70),
    0 0 25px rgba(255, 157, 0, 0.40) !important;
}

#pedidoImagem::placeholder {
  color: rgba(255, 255, 255, 0.90) !important;
}
  </style>
</head>

<body>

  <div class="chat">
    <h1>Aquiles 0.1</h1>

    <div id="mensagens">
      <div class="mensagem aquiles">
        Olá, Lourival. Eu sou o Aquiles 0.1.
      </div>
    </div>
<div class="entrada">

  <div class="barra-mensagem">
    <input
      type="text"
      id="entrada"
      placeholder="Digite uma mensagem..."
    >
    <button onclick="enviarMensagem()">Enviar</button>
  </div>

  <div class="painel-imagem">
    
    <input
      type="file"
      id="imagem"
      accept="image/*"
    >

    <img
      id="previewImagem"
      style="display:none;"
    >
  </div>

</div>

  </div>

  <script>
    let memoria = null;

    fetch("./memoria.json")
      .then(resposta => resposta.json())
      .then(dados => {
        memoria = dados;
      })
      .catch(() => {
        console.log("Não foi possível carregar a memória.");
      });

    function adicionarMensagem(texto, tipo) {
      const mensagens = document.getElementById("mensagens");

      const div = document.createElement("div");
      div.className = "mensagem " + tipo;
      div.textContent = texto;

      mensagens.appendChild(div);
      mensagens.scrollTop = mensagens.scrollHeight;
    }

    function responder(pergunta) {
      const texto = pergunta.toLowerCase();

      if (!memoria) {
        return "Minha memória ainda está carregando. Tente novamente em alguns segundos.";
      }

      if (
        texto.includes("oi") ||
        texto.includes("olá") ||
        texto.includes("ola") ||
        texto.includes("bom dia") ||
        texto.includes("boa tarde") ||
        texto.includes("boa noite")
      ) {
        return "Olá, Lourival. Que bom falar com você. Eu sou o Aquiles 0.1.";
      }

      if (
        texto.includes("seu nome") ||
        texto.includes("qual seu nome") ||
        texto.includes("quem é você") ||
        texto.includes("quem e voce")
      ) {
        return "Meu nome é " + memoria.Aquiles.Nome +
               ". Minha versão atual é " + memoria.Aquiles.Versao + ".";
      }

      if (
        texto.includes("seu criador") ||
        texto.includes("quem criou você") ||
        texto.includes("quem criou voce") ||
        texto.includes("quem é seu criador") ||
        texto.includes("quem e seu criador")
      ) {
        return "Meu criador é " + memoria.Aquiles.Criador +
               ". Ele também é meu principal parceiro de desenvolvimento.";
      }

      if (
        texto.includes("funções") ||
        texto.includes("funcoes") ||
        texto.includes("o que você faz") ||
        texto.includes("o que voce faz")
      ) {
        return "Minhas principais funções são: " +
          memoria.Aquiles.FuncoesPrincipais.join(", ") + ".";
      }

      if (
        texto.includes("quem sou eu") ||
        texto.includes("meu nome")
      ) {
        return "Você é " + memoria.Usuario.Nome +
               ", meu criador e principal parceiro de desenvolvimento.";
      }

      return "Ainda estou aprendendo, Lourival. Essa é uma das coisas que vamos ensinar ao Aquiles.";
    }

    function enviarMensagem() {
      const campo = document.getElementById("entrada");
      const pergunta = campo.value.trim();

      if (pergunta === "") {
        return;
      }

      adicionarMensagem(pergunta, "usuario");

      const resposta = responder(pergunta);

      setTimeout(() => {
        adicionarMensagem(resposta, "aquiles");
      }, 300);

      campo.value = "";
      campo.focus();
    }

    document.getElementById("entrada").addEventListener("keydown", function(evento) {
      if (evento.key === "Enter") {
        enviarMensagem();
      }
    });
  </script>
  <div class="acoes-imagem">
  <label for="imagem" class="botao-arquivo">
    Escolher imagem
  </label>

  <button id="editarImagem">Editar imagem</button>
</div>
<textarea
  id="pedidoImagem"
  placeholder="Descreva o que você quer mudar na imagem"
  style="background: linear-gradient(135deg, #ff6a00, #ff9d00) !important; color: white !important; border: 1px solid #ffb347 !important; box-shadow: 0 0 12px rgba(255,106,0,.70), 0 0 25px rgba(255,157,0,.40) !important;">
</textarea>
  <script>
  const inputImagem = document.getElementById("imagem");
  const previewImagem = document.getElementById("previewImagem");
    

async function editarImagem() {
  const arquivo = document.getElementById("imagem").files[0];
  const pedido = document.getElementById("pedidoImagem").value.trim();

  if (!arquivo) {
    alert("Escolha uma imagem primeiro.");
    return;
  }

  if (!pedido) {
    alert("Descreva o que você quer mudar na imagem.");
    return;
  }

  const formData = new FormData();
  formData.append("imagem", arquivo);
  formData.append("pedido", pedido);

  try {
    const resposta = await fetch("https://qqhltwlfooiyaalirwbi.supabase.co/functions/v1/editar-imagem", {
      method: "POST",
      headers: {
  "apikey": "sb_publishable_U1CpDb91_Q3Nn05Hfu9Wsw_9MT5kEhY"
},
      body: formData
    });

    const dados = await resposta.json();

    if (!resposta.ok) {
      throw new Error(dados.erro || "Erro ao editar imagem.");
    }

    if (dados.imagemEditada) {
      previewImagem.src = dados.imagemEditada;
      previewImagem.style.display = "block";
      alert("Imagem editada com sucesso.");
    } else {
      alert("A resposta veio sem imagem editada.");
    }
  } catch (erro) {
    console.error(erro);
    alert("Erro ao editar imagem: " + erro.message);
  }
}

document.getElementById("editarImagem").addEventListener("click", editarImagem);
  inputImagem.addEventListener("change", function () {
  const arquivo = this.files[0];

  if (arquivo) {
    previewImagem.src = URL.createObjectURL(arquivo);
    previewImagem.style.display = "block";
  }
});
      
</script>
</body>
</html>
